
 <!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI로 포켓몬 찾기</title>
  <style>
    :root {
      --cream: #fff9e9;
      --yellow: #ffdf75;
      --yellow-dark: #efbd42;
      --brown: #59472e;
      --muted: #897b65;
      --white: #fffef9;
      --pink: #ffe4df;
      --green: #e4f0d8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 18px 50px;
      background: var(--cream);
      color: var(--brown);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo",
        sans-serif;
      font-size: 17px;
      line-height: 1.7;
    }

    button {
      font: inherit;
    }

    .container {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
    }

    .hero {
      text-align: center;
      padding: 28px 16px 24px;
    }

    .hero-icon {
      font-size: 66px;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .eyebrow {
      display: inline-block;
      padding: 5px 14px;
      background: #fff0b8;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    h1 {
      margin: 13px 0 8px;
      font-size: clamp(30px, 6vw, 45px);
      line-height: 1.25;
      letter-spacing: -1.5px;
    }

    .subtitle {
      color: var(--muted);
      margin: 12px 0 0;
      font-size: 17px;
    }

    .panel {
      background: var(--white);
      border: 2px solid #f4e8c9;
      border-radius: 26px;
      padding: 28px;
      box-shadow: 0 8px 0 #f4e8c9;
      margin-bottom: 26px;
    }

    .section-title {
      font-size: 23px;
      margin: 0 0 5px;
      letter-spacing: -0.5px;
    }

    .section-description {
      color: var(--muted);
      font-size: 15px;
      margin: 0 0 22px;
    }

    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 11px;
    }

    .mbti-button {
      min-height: 62px;
      border: 2px solid #f0e4c8;
      border-radius: 15px;
      background: #fffdf7;
      color: var(--brown);
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s,
        border-color 0.15s;
    }

    .mbti-button:hover {
      background: #fff1b7;
      border-color: var(--yellow-dark);
      transform: translateY(-2px);
    }

    .mbti-button:focus-visible,
    .retry-button:focus-visible {
      outline: 3px solid #9a762c;
      outline-offset: 3px;
    }

    .result {
      display: none;
      animation: appear 0.35s ease-out;
    }

    .result.show {
      display: block;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-heading {
      text-align: center;
      margin-bottom: 20px;
    }

    .result-heading .eyebrow {
      background: var(--green);
    }

    .result-heading h2 {
      margin: 12px 0 0;
      font-size: 28px;
      letter-spacing: -0.8px;
    }

    .pokemon-card {
      text-align: center;
      background: #fff4c9;
      border: 2px solid #f5df92;
      border-radius: 24px;
      padding: 28px 20px;
    }

    .pokemon-emoji {
      font-size: clamp(90px, 18vw, 135px);
      line-height: 1.4;
      margin: 5px 0 0;
      filter: drop-shadow(0 5px 2px #dfc985);
    }

    .pokemon-name {
      font-size: 34px;
      font-weight: 900;
      margin: 3px 0 0;
      letter-spacing: -1px;
    }

    .pokemon-type {
      display: inline-block;
      margin-top: 9px;
      padding: 4px 13px;
      background: #fffdf5;
      border-radius: 100px;
      font-size: 14px;
      color: #77633d;
      font-weight: 700;
    }

    .reason-card {
      margin-top: 18px;
      padding: 22px;
      border-radius: 20px;
      background: #fffdf7;
      border: 2px solid #f2e8d2;
    }

    .reason-card h3 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .reason-card p {
      margin: 7px 0;
      color: #68563e;
    }

    .reason-card p::before {
      content: "✦ ";
      color: #d6a52f;
      font-weight: 900;
    }

    .match-card {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 18px;
      padding: 20px;
      border-radius: 20px;
      background: var(--pink);
      border: 2px solid #f5d2ca;
    }

    .match-emoji {
      flex-shrink: 0;
      font-size: 48px;
    }

    .match-label {
      font-size: 14px;
      color: #9b665c;
      font-weight: 800;
    }

    .match-title {
      font-size: 23px;
      font-weight: 900;
      margin: 0;
    }

    .match-description {
      font-size: 15px;
      color: #785b52;
      margin: 3px 0 0;
    }

    .retry-wrap {
      text-align: center;
      padding-top: 24px;
    }

    .retry-button {
      background: var(--yellow);
      border: 2px solid var(--yellow-dark);
      color: var(--brown);
      border-radius: 100px;
      padding: 13px 30px;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }

    .retry-button:hover {
      background: #ffd451;
      transform: translateY(-2px);
    }

    .note {
      text-align: center;
      font-size: 13px;
      color: #a0937e;
      margin: 28px 0 0;
    }

    @media (max-width: 520px) {
      body {
        padding: 15px 12px 35px;
      }

      .hero {
        padding: 23px 5px 22px;
      }

      .panel {
        padding: 20px 15px;
        border-radius: 22px;
      }

      .mbti-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 7px;
      }

      .mbti-button {
        min-height: 53px;
        font-size: 16px;
        border-radius: 12px;
      }

      .match-card {
        padding: 15px;
        gap: 11px;
      }

      .match-emoji {
        font-size: 38px;
      }

      .match-title {
        font-size: 21px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="hero">
      <div class="hero-icon" aria-hidden="true">⚡🐣🌼</div>
      <span class="eyebrow">MY MBTI × POKÉMON</span>
      <h1>MBTI로 포켓몬 찾기</h1>
      <p class="subtitle">
        내 성격이랑 꼭 닮은 포켓몬은 누구일까?<br>
        MBTI를 고르고 나만의 포켓몬을 만나 봐!
      </p>
    </header>

    <section class="panel" aria-labelledby="select-title">
      <h2 class="section-title" id="select-title">
        🌈 내 MBTI를 골라 줘!
      </h2>
      <p class="section-description">
        16가지 유형 중 나와 가장 가까운 유형을 선택해 봐.
      </p>

      <div class="mbti-grid" id="mbtiGrid">
        <button class="mbti-button" data-mbti="ISTJ">ISTJ</button>
        <button class="mbti-button" data-mbti="ISFJ">ISFJ</button>
        <button class="mbti-button" data-mbti="INFJ">INFJ</button>
        <button class="mbti-button" data-mbti="INTJ">INTJ</button>
        <button class="mbti-button" data-mbti="ISTP">ISTP</button>
        <button class="mbti-button" data-mbti="ISFP">ISFP</button>
        <button class="mbti-button" data-mbti="INFP">INFP</button>
        <button class="mbti-button" data-mbti="INTP">INTP</button>
        <button class="mbti-button" data-mbti="ESTP">ESTP</button>
        <button class="mbti-button" data-mbti="ESFP">ESFP</button>
        <button class="mbti-button" data-mbti="ENFP">ENFP</button>
        <button class="mbti-button" data-mbti="ENTP">ENTP</button>
        <button class="mbti-button" data-mbti="ESTJ">ESTJ</button>
        <button class="mbti-button" data-mbti="ESFJ">ESFJ</button>
        <button class="mbti-button" data-mbti="ENFJ">ENFJ</button>
        <button class="mbti-button" data-mbti="ENTJ">ENTJ</button>
      </div>
    </section>

    <section class="panel result" id="result"
      aria-labelledby="resultTitle" aria-live="polite">
      <div class="result-heading">
        <span class="eyebrow">YOUR POKÉMON</span>
        <h2 id="resultTitle">너와 닮은 포켓몬!</h2>
      </div>

      <div class="pokemon-card">
        <div class="pokemon-emoji" id="pokemonEmoji"
          role="img" aria-label="포켓몬 이모지">⚡</div>
        <div class="pokemon-name" id="pokemonName">피카츄</div>
        <span class="pokemon-type" id="pokemonType">밝고 에너지 넘치는 타입</span>
      </div>

      <div class="reason-card">
        <h3>💛 너와 닮은 이유</h3>
        <div id="pokemonReasons"></div>
      </div>

      <div class="match-card">
        <div class="match-emoji" id="matchEmoji"
          role="img" aria-label="궁합 포켓몬">🌱</div>
        <div>
          <div class="match-label">BEST MATCH · 잘 맞는 유형</div>
          <p class="match-title" id="matchTitle">ISFJ</p>
          <p class="match-description" id="matchDescription">
            서로의 장점을 보완해 주는 좋은 친구!
          </p>
        </div>
      </div>

      <div class="retry-wrap">
        <button class="retry-button" id="retryButton">
          ↩ 다시 고르기
        </button>
      </div>
    </section>

    <footer class="note">
      ※ 포켓몬과 MBTI의 조합은 재미를 위한 창작 결과예요. 🌼
    </footer>
  </main>

    const grid = document.getElementById("mbtiGrid");

    const resultTitle = document.getElementById("resultTitle");
    const pokemonEmoji = document.getElementById("pokemonEmoji");
    const pokemonName = document.getElementById("pokemonName");
    const pokemonType = document.getElementById("pokemonType");
    const pokemonReasons = document.getElementById("pokemonReasons");
    const matchEmoji = document.getElementById("matchEmoji");
    const matchTitle = document.getElementById("matchTitle");
    const matchDescription =
      document.getElementById("matchDescription");
    const retryButton = document.getElementById("retryButton");

    function showPokemon(mbti) {
      const data = pokemonData[mbti];

      if (!data) return;

      resultTitle.textContent = mbti + "인 너와 닮은 포켓몬!";
      pokemonEmoji.textContent = data.emoji;
      pokemonName.textContent = data.name;
      pokemonType.textContent = data.type;

      // 설명 문장을 안전하게 생성
      pokemonReasons.replaceChildren();

      data.reasons.forEach(function(reason) {
        const paragraph = document.createElement("p");
        paragraph.textContent = reason;
        pokemonReasons.appendChild(paragraph);
      });

      matchEmoji.textContent = data.matchEmoji;
      matchTitle.textContent = data.match;
      matchDescription.textContent = data.matchDesc;

      result.classList.add("show");

      // 결과를 바로 확인할 수 있도록 결과 영역으로 이동
      result.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    grid.addEventListener("click", function(event) {
      const button = event.target.closest("[data-mbti]");

      if (!button) return;

      showPokemon(button.dataset.mbti);
    });

    retryButton.addEventListener("click", function() {
      result.classList.remove("show");

      // 유형 선택 영역으로 돌아가기
      document.getElementById("select-title").scrollIntoView({
        behavior: "smooth",
        block: "center"
      });
    });
  </script>
</body>
</html>
