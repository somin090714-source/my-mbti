```html
<!DOCTYPE html>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: #fff9e9;
      color: #51452f;

    .container {
      max-width: 850px;

    }

      margin-bottom: 10px;

      font-size: clamp(27px, 5vw, 38px);
    }

    .subtitle {
      margin-bottom: 28px;
      color: #887650;
      line-height: 1.7;
    }

    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 30px;
    }

    .mbti-button {
      padding: 13px 4px;
      border: 2px solid #f1d58b;
      border-radius: 14px;
      background: #fffdf6;
      color: #71572c;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .mbti-button:hover {
      background: #fff0bd;
      transform: translateY(-2px);
    }

    .mbti-button.active {
      background: #f6d66f;
      border-color: #e9bd43;
      color: #5b451d;
    }

    .result {
      display: none;
      padding: 25px 20px;
      border: 2px solid #f2d990;
      border-radius: 24px;
      background: #fffef9;
      box-shadow: 0 8px 25px rgba(139, 109, 43, 0.08);
      animation: appear 0.35s ease;
    }

    .result.show {
      display: block;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-label {
      display: inline-block;
      padding: 7px 13px;
      border-radius: 20px;
      background: #fff0bd;
      color: #795d27;
      font-size: 14px;
      font-weight: bold;
    }

    .pokemon-name {
      margin: 16px 0 4px;
      color: #5e4a27;
      font-size: 29px;
    }

    .pokemon-english {
      margin: 0;
      color: #a18a5b;
      font-size: 14px;
    }

    .image-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 220px;
      height: 220px;
      max-width: 100%;
      margin: 12px auto;
      border-radius: 50%;
      background: #fff5d8;
      overflow: hidden;
    }

    .pokemon-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .emoji-fallback {
      display: none;
      font-size: 100px;
    }

    .description {
      max-width: 520px;
      margin: 18px auto;
      color: #6d5a3b;
      font-size: 16px;
      line-height: 1.9;
      word-break: keep-all;
    }

    .compatibility {
      display: inline-block;
      margin: 5px 0 20px;
      padding: 12px 18px;
      border-radius: 14px;
      background: #fff5d8;
      line-height: 1.7;
    }

    .compatibility strong {
      color: #9b742b;
    }

    .retry-button {
      display: block;
      margin: 8px auto 0;
      padding: 13px 24px;
      border: none;
      border-radius: 25px;
      background: #edc75f;
      color: #60491d;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .retry-button:hover {
      background: #e5b83d;
      transform: scale(1.03);
    }

    .footer {
      margin-top: 28px;
      color: #a18e6b;
      font-size: 12px;
      line-height: 1.7;
    }

    @media (max-width: 480px) {
      body {
        padding: 24px 12px;
      }

      .mbti-grid {
        gap: 8px;
      }

      .mbti-button {
        padding: 12px 2px;
        font-size: 14px;
      }

      .image-wrap {
        width: 190px;
        height: 190px;
      }

      .result {
        padding: 22px 14px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>🌼 MBTI로 포켓몬 찾기 🌼</h1>

    <p class="subtitle">
      내 MBTI와 닮은 포켓몬은 누구일까?<br>
      나의 MBTI를 선택하고 운명의 포켓몬을 만나 봐!
    </p>

    <div class="mbti-grid" id="mbtiGrid"></div>

    <section class="result" id="result" aria-live="polite">
      <span class="result-label" id="resultLabel"></span>

      <h2 class="pokemon-name" id="pokemonName"></h2>
      <p class="pokemon-english" id="pokemonEnglish"></p>

      <div class="image-wrap">
        <img
          class="pokemon-image"
          id="pokemonImage"
          alt="포켓몬 이미지"
          referrerpolicy="no-referrer"
        >
        <div class="emoji-fallback" id="emojiFallback" aria-label="포켓몬 이미지 대체 표시">
          ✨
        </div>
      </div>

      <p class="description" id="description"></p>

      <div class="compatibility">
        💛 <strong>환상의 궁합</strong><br>
        <span id="compatibleMbti"></span>
      </div>

      <button class="retry-button" id="retryButton">
        🔄 다른 포켓몬 만나기
      </button>
    </section>

    <p class="footer">
      포켓몬 이미지는 포켓몬코리아 공식 도감 이미지 주소를 사용합니다.<br>
      본 콘텐츠는 재미를 위한 MBTI 기반의 비공식 콘텐츠입니다.
    </p>
  </main>

  <script>
    const pokemonData = {
      "INTJ": {
        name: "뮤츠",
        english: "Mewtwo",
        dex: 150,
        emoji: "🔮",
        compatible: "ENFP",
        description: "차분하고 전략적인 면이 뮤츠와 닮았어요.\\n혼자 깊이 생각하며 목표를 향해 나아가는 타입!"
      },
      "INTP": {
        name: "메타몽",
        english: "Ditto",
        dex: 132,
        emoji: "🟣",
        compatible: "ENTJ",
        description: "호기심이 많고 독특한 사고방식을 가졌어요.\\n새로운 아이디어를 탐구하는 모습이 메타몽 같아요!"
      },
      "ENTJ": {
        name: "리자몽",
        english: "Charizard",
        dex: 6,
        emoji: "🔥",
        compatible: "INTP",
        description: "자신감과 추진력이 넘치는 리더 타입!\\n목표가 생기면 강한 의지로 끝까지 도전해요."
      },
      "ENTP": {
        name: "팬텀",
        english: "Gengar",
        dex: 94,
        emoji: "👻",
        compatible: "INFJ",
        description: "재치 있고 장난기 넘치는 아이디어 뱅크예요.\\n뻔한 것보다는 새롭고 재미있는 것을 좋아해요!"
      },
      "INFJ": {
        name: "루카리오",
        english: "Lucario",
        dex: 448,
        emoji: "💙",
        compatible: "ENTP",
        description: "상대의 마음을 잘 읽고 신념이 뚜렷해요.\\n조용하지만 소중한 사람을 지키는 힘이 있어요."
      },
      "INFP": {
        name: "이브이",
        english: "Eevee",
        dex: 133,
        emoji: "🤎",
        compatible: "ENFJ",
        description: "따뜻하고 감수성이 풍부한 마음의 소유자!\\n자신만의 가능성을 품고 천천히 성장해 나가요."
      },
      "ENFJ": {
        name: "피카츄",
        english: "Pikachu",
        dex: 25,
        emoji: "⚡",
        compatible: "INFP",
        description: "밝은 에너지로 주변 사람들을 행복하게 해요.\\n친구를 아끼고 함께할 때 더 큰 힘을 발휘해요!"
      },
      "ENFP": {
        name: "파치리스",
        english: "Pachirisu",
        dex: 417,
        emoji: "🐿️",
        compatible: "INTJ",
        description: "호기심이 넘치고 어디서나 활기를 불어넣어요.\\n새로운 만남과 즐거운 경험을 사랑하는 타입!"
      },
      "ISTJ": {
        name: "거북왕",
        english: "Blastoise",
        dex: 9,
        emoji: "🐢",
        compatible: "ESFP",
        description: "책임감이 강하고 믿음직스러운 성격이에요.\\n차근차근 맡은 일을 해내는 모습이 든든해요."
      },
      "ISFJ": {
        name: "잠만보",
        english: "Snorlax",
        dex: 143,
        emoji: "💤",
        compatible: "ESFP",
        description: "포근하고 다정하며 편안함을 소중히 여겨요.\\n주변 사람들을 조용히 챙겨 주는 따뜻한 타입!"
      },
      "ESTJ": {
        name: "괴력몬",
        english: "Machamp",
        dex: 68,
        emoji: "💪",
        compatible: "ISFP",
        description: "실행력이 뛰어나고 책임감이 강해요.\\n팀을 이끌고 목표를 이루는 데 능숙한 타입!"
      },
      "ESFJ": {
        name: "푸린",
        english: "Jigglypuff",
        dex: 39,
        emoji: "🎤",
        compatible: "ISFP",
        description: "사람들과 어울리며 행복을 나누는 걸 좋아해요.\\n다정한 말과 행동으로 분위기를 따뜻하게 만들어요."
      },
      "ISTP": {
        name: "메타그로스",
        english: "Metagross",
        dex: 376,
        emoji: "🤖",
        compatible: "ESFJ",
        description: "침착하고 분석적이며 문제 해결에 강해요.\\n말보다 실력으로 보여 주는 멋진 타입!"
      },
      "ISFP": {
        name: "치코리타",
        english: "Chikorita",
        dex: 152,
        emoji: "🍃",
        compatible: "ESFJ",
        description: "부드럽고 감각적이며 평화를 좋아해요.\\n자신만의 취향과 소중한 사람들을 아껴요."
      },
      "ESTP": {
        name: "갸라도스",
        english: "Gyarados",
        dex: 130,
        emoji: "🌊",
        compatible: "ISFJ",
        description: "대담하고 에너지가 넘치는 행동파예요.\\n망설이기보다 직접 부딪쳐 경험하는 걸 좋아해요!"
      },
      "ESFP": {
        name: "꼬부기",
        english: "Squirtle",
        dex: 7,
        emoji: "💧",
        compatible: "ISTJ",
        description: "명랑하고 사교적이며 즐거움을 잘 찾아요.\\n친구들과 함께할 때 매력이 더욱 빛나요!"
      }
    };

    const mbtiTypes = Object.keys(pokemonData);
    const mbtiGrid = document.getElementById("mbtiGrid");
    const result = document.getElementById("result");

    let selectedMbti = null;

    // MBTI 버튼 16개 만들기
    mbtiTypes.forEach(function(mbti) {
      const button = document.createElement("button");

      button.className = "mbti-button";
      button.textContent = mbti;
      button.type = "button";
      button.dataset.mbti = mbti;

      button.addEventListener("click", function() {
        showPokemon(mbti);
      });

      mbtiGrid.appendChild(button);
    });

    function showPokemon(mbti) {
      selectedMbti = mbti;

      const pokemon = pokemonData[mbti];

      document.querySelectorAll(".mbti-button").forEach(function(button) {
        button.classList.toggle(
          "active",
          button.dataset.mbti === mbti
        );
      });

      document.getElementById("resultLabel").textContent =
        mbti + "에게 어울리는 포켓몬";

      document.getElementById("pokemonName").textContent =
        pokemon.name;

      document.getElementById("pokemonEnglish").textContent =
        pokemon.english;

      document.getElementById("description").textContent =
        pokemon.description.replace(/\\n/g, "\n");

      document.getElementById("description").style.whiteSpace =
        "pre-line";

      document.getElementById("compatibleMbti").textContent =
        pokemon.compatible;

      const image = document.getElementById("pokemonImage");
      const fallback = document.getElementById("emojiFallback");

      fallback.style.display = "none";
      image.style.display = "block";
      image.alt = pokemon.name + " (" + pokemon.english + ")";

      // 공식 포켓몬 도감 이미지 주소
      const imageNumber = String(pokemon.dex).padStart(4, "0");
      image.src =
        "https://data1.pokemonkorea.co.kr/newdata/pokedex/mid/" +
        imageNumber + "01.png";

      // 이미지가 불러와지지 않으면 이모지로 대체
      image.onerror = function() {
        image.style.display = "none";
        fallback.textContent = pokemon.emoji;
        fallback.style.display = "block";
      };

      result.classList.remove("show");

      // 애니메이션을 다시 실행
      void result.offsetWidth;
      result.classList.add("show");

      result.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    // 다른 포켓몬 만나기
    document.getElementById("retryButton").addEventListener(
      "click",
      function() {
        const otherTypes = mbtiTypes.filter(function(mbti) {
          return mbti !== selectedMbti;
        });

        const randomMbti =
          otherTypes[Math.floor(Math.random() * otherTypes.length)];

        showPokemon(randomMbti);
      }
    );
  </script>
</body>
</html>
